# ANNOTATED REFERENCE ONLY — you don't need to copy this by hand anymore: the bridge
# generates config.toml (with correct absolute paths) and copies auth.json from your
# global ~/.codex/ on first start. Edit the generated config.toml if you want custom
# settings; delete it to regenerate.
#
# Design notes: the CODEX_HOME is isolated on purpose — keep ONLY the foundry MCP
# server here, unrelated servers from the global ~/.codex/config.toml make
# `codex exec` hang on their init (observed ~4 min vs ~9s).

model = "gpt-5.5"
model_reasoning_effort = "low"

# Trust the working directory the bridge launches codex from (default: $HOME) and
# the package directory, so codex does not block on a trust prompt.
[projects."/ABSOLUTE/PATH/TO/HOME"]
trust_level = "trusted"

[mcp_servers.foundry]
command = "node"
args = ["/ABSOLUTE/PATH/TO/gm-bridge/src/foundry-mcp.js"]
default_tools_approval_mode = "auto"
